---
- name: Machine setup
  hosts: localhost
  become: false
  connection: local
  gather_facts: true

  pre_tasks:

#    - name: Display all facts
#      debug:
#        var: ansible_facts

    - name: Fail on invalid OS/Arch
      fail:
        msg: "Unsupported OS+Arch! (only Linux+amd64 or Darwin+arm64 is allowed)"
      tags: always
      when: >
        not ( ( ansible_os_family == "Darwin" and ansible_architecture == "arm64" ) or
              ( ansible_os_family == "Debian" and ansible_architecture == "x86_64" ) )

    - name: Mac fact
      ansible.builtin.set_fact:
        mac: true
        linux: false
      tags: always
      when: ansible_os_family == "Darwin" and ansible_architecture == "arm64"

    - name: Linux fact
      ansible.builtin.set_fact:
        mac: false
        linux: true
      tags: always
      when: ansible_os_family == "Debian" and ansible_architecture == "x86_64"

    # Ubuntu's default sudo is sudo-rs. Ansible 2.20 does not recognize its
    # password prompt, so become times out. sudo.ws is the classic sudo binary.
    - name: Use classic sudo for Ansible become
      ansible.builtin.set_fact:
        ansible_become_exe: /usr/bin/sudo.ws
      tags: always
      when: linux

  tasks:
    - name: Include Install Tasks
      include_tasks: install.yaml
      tags: always
