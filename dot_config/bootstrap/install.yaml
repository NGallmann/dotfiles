---
- name: Set facts for common packages (Linux and Mac)
  set_fact:
    # basic packages that do exist in brew and apt-get
    common_packages:
      - git
      - ipcalc
      - zsh
      - bash
      - bash-completion
      - ca-certificates
      - grc
      - wget
      - curl
      - tree
      - htop
      - fzf
      - vim
      - age
      - jq
      - xclip
      - tcpdump
      - ripgrep

- name: Execute geerlingguy's Mac installer
  when: mac
  include_role:
    name: geerlingguy.mac.homebrew
  vars:
    homebrew_upgrade_all_packages: true
    # these packages are unique and do not exist in apt-get
    homebrew_specific_installed_packages:
      - rbw
      - chezmoi
      - dog
      - yq
      - gnutls
      - gnu-getopt
      - gnu-indent
      - gnu-sed
      - gnu-tar
      - openfortivpn
    homebrew_installed_packages: "{{ common_packages + homebrew_specific_installed_packages }}"
    homebrew_cask_accept_external_apps: true
    homebrew_cask_apps:
      - firefox
      - brave-browser
      - vscodium
      - bitwarden
      - podman-desktop
      - forkgram-telegram
      - whatsapp
      - element
      - spotify
      - joplin
      - todoist
      - rectangle
# Missing packages on linux
# - wireshark

- name: Install Linux Packages
  when: linux
  become: true
  vars:
    apt_specific_packages:
      - dnsutils
      - usbutils
      - podman
      - pciutils
      - gdebi-core
      - nfs-common
      - net-tools
      - python3
      - wireshark
      - tilix
      - screen
      - openfortivpn
      - btop
      - yq
      - xz-utils

  apt:
    name: "{{ common_packages + apt_specific_packages }}"

- name: Install Herdr and ensure the managed Pi install
  vars:
    user_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    herdr_asset_name: "{{ 'herdr-linux-x86_64' if linux else 'herdr-macos-aarch64' }}"
  block:
    - name: Ensure ~/.local/bin exists
      file:
        path: "{{ user_bin }}"
        state: directory
        mode: "0755"

    - name: Read the latest Herdr GitHub release
      uri:
        url: https://api.github.com/repos/herdrdev/herdr/releases/latest
        headers:
          Accept: application/vnd.github+json
      register: herdr_latest

    - name: Select the Herdr release asset for this machine
      set_fact:
        herdr_asset: >-
          {{ herdr_latest.json.assets
             | selectattr('name', 'equalto', herdr_asset_name)
             | first }}

    - name: Require a Herdr release checksum
      assert:
        that:
          - herdr_asset.digest is match('^sha256:[0-9a-f]{64}$')
        fail_msg: GitHub release asset is missing a sha256 digest

    - name: Install Herdr
      get_url:
        url: "{{ herdr_asset.browser_download_url }}"
        dest: "{{ user_bin }}/herdr"
        mode: "0755"
        checksum: "{{ herdr_asset.digest }}"

    # Official installer: npm ci --ignore-scripts of the published lockfile under
    # ~/.pi/agent. A healthy install is left alone so `pi update` owns upgrades.
    # npm install -g does not pin transitive dependencies.
    - name: Ensure Pi's managed install
      command: "{{ ansible_facts['env']['HOME'] }}/.config/bootstrap/install-pi.sh"
      register: pi_managed
      changed_when: "'installed-managed-pi' in pi_managed.stdout"

