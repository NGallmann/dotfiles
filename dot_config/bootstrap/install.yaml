---
- name: Set facts for common packages (Linux and Mac)
  set_fact:
    # basic packages that do exist in brew and apt-get
    common_packages:
      - git
      - ipcalc
      - zsh
      - bash
      - bash-completion
      - ca-certificates
      - grc
      - wget
      - curl
      - tree
      - htop
      - fzf
      - vim
      - age
      - jq
      - xclip
      - tcpdump
      - ripgrep

- name: Execute geerlingguy's Mac installer
  when: mac
  include_role:
    name: geerlingguy.mac.homebrew
  vars:
    homebrew_upgrade_all_packages: true
    # these packages are unique and do not exist in apt-get
    homebrew_specific_installed_packages:
      - rbw
      - chezmoi
      - dog
      - yq
      - gnutls
      - gnu-getopt
      - gnu-indent
      - gnu-sed
      - gnu-tar
      - openfortivpn
    homebrew_installed_packages: "{{ common_packages + homebrew_specific_installed_packages }}"
    homebrew_cask_accept_external_apps: true
    homebrew_cask_apps:
      - firefox
      - brave-browser
      - vscodium
      - bitwarden
      - podman-desktop
      - forkgram-telegram
      - whatsapp
      - element
      - spotify
      - joplin
      - todoist
      - rectangle
# Missing packages on linux
# - wireshark

# WezTerm APT repo: https://wezterm.org/install/linux.html
- name: Configure WezTerm APT repository
  when: linux
  become: true
  block:
    - name: Download WezTerm APT signing key
      get_url:
        url: https://apt.fury.io/wez/gpg.key
        dest: /tmp/wezterm-fury.key
        mode: "0644"

    - name: Install WezTerm APT keyring
      command: gpg --batch --yes --dearmor -o /usr/share/keyrings/wezterm-fury.gpg /tmp/wezterm-fury.key
      args:
        creates: /usr/share/keyrings/wezterm-fury.gpg

    - name: Set WezTerm APT keyring permissions
      file:
        path: /usr/share/keyrings/wezterm-fury.gpg
        mode: "0644"

    - name: Add WezTerm APT repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *"
        filename: wezterm
        state: present
        update_cache: true

- name: Install Linux Packages
  when: linux
  become: true
  vars:
    apt_specific_packages:
      - dnsutils
      - usbutils
      - podman
      - pciutils
      - gdebi-core
      - nfs-common
      - net-tools
      - python3
      - wireshark
      - tilix
      - screen
      - openfortivpn
      - btop
      - yq
      - wezterm

  apt:
    name: "{{ common_packages + apt_specific_packages }}"

- name: Install latest Pi and Herdr into ~/.local/bin
  vars:
    user_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    herdr_asset_name: "{{ 'herdr-linux-x86_64' if linux else 'herdr-macos-aarch64' }}"
  block:
    - name: Ensure ~/.local/bin exists
      file:
        path: "{{ user_bin }}"
        state: directory
        mode: "0755"

    - name: Read latest GitHub releases
      uri:
        url: "https://api.github.com/repos/{{ item }}/releases/latest"
        headers:
          Accept: application/vnd.github+json
      loop:
        - earendil-works/pi
        - herdrdev/herdr
      register: github_latest

    - name: Select GitHub releases for this machine
      set_fact:
        herdr_release: >-
          {{ github_latest.results
             | selectattr('item', 'equalto', 'herdrdev/herdr')
             | map(attribute='json')
             | first }}
        pi_version: >-
          {{ (github_latest.results
              | selectattr('item', 'equalto', 'earendil-works/pi')
              | map(attribute='json')
              | first).tag_name
             | regex_replace('^v', '') }}

    - name: Select the Herdr release asset for this machine
      set_fact:
        herdr_asset: >-
          {{ herdr_release.assets
             | selectattr('name', 'equalto', herdr_asset_name)
             | first }}

    - name: Require a Herdr release checksum
      assert:
        that:
          - herdr_asset.digest is match('^sha256:[0-9a-f]{64}$')
        fail_msg: GitHub release asset is missing a sha256 digest

    - name: Install Herdr
      get_url:
        url: "{{ herdr_asset.browser_download_url }}"
        dest: "{{ user_bin }}/herdr"
        mode: "0755"
        checksum: "{{ herdr_asset.digest }}"

    # The GitHub archive is a standalone binary. pi-sandbox forks that
    # process to run its broker, so bash never starts. The npm launcher is a
    # Node script, and fork() then uses Node.
    - name: See how Pi is installed
      stat:
        path: "{{ user_bin }}/pi"
      register: pi_bin

    - name: Read the installed Pi version
      command: "{{ user_bin }}/pi --version"
      register: pi_installed
      changed_when: false
      failed_when: false

    - name: Install Pi with npm
      command: >-
        npm install --global --prefix {{ ansible_facts['env']['HOME'] }}/.local
        @earendil-works/pi-coding-agent@{{ pi_version }}
      environment:
        NPM_CONFIG_FUND: "false"
        NPM_CONFIG_UPDATE_NOTIFIER: "false"
      when: >-
        not pi_bin.stat.exists
        or pi_bin.stat.islnk
        or (pi_installed.stdout | default('') | trim) != pi_version

